server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: el navegador solo habla con Campus Core (mismo origen),
    # y Nginx accede a las API del Equipo 1 evitando bloqueos CORS.
    # Cambia esta IP si el Equipo 1 obtiene otra dirección en la red.
    location /api/clientes {
        proxy_pass http://192.168.1.148:3001/clientes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/productos {
        proxy_pass http://192.168.1.148:3002/productos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
