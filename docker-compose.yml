services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-team3root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-team3_inventory}
      MYSQL_USER: ${MYSQL_USER:-team3_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-team3pass123}
    ports:
      - "20001:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  notifications:
    build: ./notifications
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-team3_inventory}
      DB_USER: ${MYSQL_USER:-team3_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-team3pass123}
    ports:
      - "20003:3002"
    depends_on:
      mysql:
        condition: service_healthy

  inventory:
    build: ./inventory
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-team3_inventory}
      DB_USER: ${MYSQL_USER:-team3_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-team3pass123}
      NOTIFICATIONS_URL: http://notifications:3002
    ports:
      - "20002:3001"
    depends_on:
      mysql:
        condition: service_healthy
      notifications:
        condition: service_started

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "20004:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - inventory
      - notifications

volumes:
  mysql_data:
